spring.application.name=apigateway
server.port=${PORT:8000}

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=https://medicore-2-production.up.railway.app
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=bloodbank-service
spring.cloud.gateway.routes[1].uri=https://medicore-2-production-1411.up.railway.app
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/bloodbank/**

spring.cloud.gateway.routes[2].id=communication-service
spring.cloud.gateway.routes[2].uri=https://medicoresweproject-production.up.railway.app
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/chat/**

spring.cloud.gateway.routes[3].id=user-service
spring.cloud.gateway.routes[3].uri=https://medicoresweproject-production-ef08.up.railway.app
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/**